<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fortino">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morto un presidente se ne fa un altro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Architects+Daughter&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&display=swap">
<style>

/* Layout: un fascicolo d'indagine scuro; carte, scontrini e polaroid chiare appoggiate sopra; i segnalini gialli della scientifica sono l'unico gesto vivace */
:root{
  color-scheme:dark;
  --bg:#15171c; --panel:#1f222a; --line:#343944; --text:#ebe4d4; --mut:#a29c8f;
  --paper:#efe6d2; --paper2:#f7f3ea; --ink:#1f1d1a; --inkmut:#5f584c;
  --red:#b9322e; --tag:#f3c234; --tagink:#1b1a16; --ok:#7fb48a;
  --f-disp:"Special Elite","Courier New",monospace;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-mono:"Courier Prime","Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--text);font:17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
#app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem}
h3{font-size:1.15rem}
p{margin:0}
.mut{color:var(--mut)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:14px}

/* barra in alto */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .case{font-family:var(--f-disp);font-size:.95rem;background:none;border:1px solid var(--line);border-radius:3px;padding:8px 12px;min-height:44px;cursor:pointer}
.top .count{font-family:var(--f-mono);font-size:.85rem;color:var(--mut);font-variant-numeric:tabular-nums}
.top .count b{color:var(--tag);font-weight:700}

/* navigazione */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0f1114;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;background:none;border:0;padding:14px 2px 13px;min-height:54px;font-family:var(--f-disp);font-size:.82rem;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--text);border-top-color:var(--red)}

/* copertina */
.cover{position:fixed;inset:0;background:#0b0c0f;z-index:20;overflow:hidden}
.cvbox{position:absolute;top:0;left:50%;height:100%;aspect-ratio:941/1670;transform:translateX(-50%)}
.cvbox img{display:block;width:100%;height:100%;max-width:none}
.ttl{position:absolute;left:22%;top:62%;width:58%;height:23%;background:transparent;border:0;cursor:pointer;border-radius:6px}
.hint{position:absolute;left:50%;top:86%;transform:translateX(-50%);background:rgba(11,12,15,.85);color:var(--text);font-family:var(--f-disp);font-size:.85rem;padding:5px 14px;border-radius:14px;white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.hint{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
.credbtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(11,12,15,.85);border:1px solid var(--text);border-radius:3px;padding:0 16px;min-height:44px;font-family:var(--f-disp);cursor:pointer;z-index:2}

/* bottoni */
.btn{display:block;width:100%;background:var(--red);color:#fff;border:0;border-radius:3px;padding:14px 16px;min-height:50px;font-family:var(--f-disp);font-size:1.05rem;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.back{background:none;border:0;color:var(--mut);font-family:var(--f-disp);padding:8px 0;min-height:44px;cursor:pointer}

/* polaroid e scene */
.pol{background:#f4f1e9;padding:10px 10px 34px;box-shadow:0 10px 28px rgba(0,0,0,.55);transform:rotate(var(--rot,-.8deg))}
.pol.framed{background:none;padding:0;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.scene{position:relative;line-height:0}
.scene img{width:100%;height:auto;display:block}
.mk{position:absolute;transform:translate(-50%,-100%);width:34px;height:30px;padding:0;border:0;background:none;cursor:pointer}
.mk::before{content:"";position:absolute;inset:0;background:var(--tag);clip-path:polygon(12% 100%,50% 0,88% 100%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.mk span{position:relative;display:block;padding-top:9px;font:700 .9rem/1 var(--f-mono);color:var(--tagink)}
.mk.done::before{background:#9c968a}
.mk.new::after{content:"";position:absolute;left:50%;top:-6px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
@media (prefers-reduced-motion:no-preference){.mk:not(.done)::before{animation:glow 2.8s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 7px rgba(243,194,52,.85))}}}
.mklist{display:grid;gap:8px}
.mkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-height:48px;cursor:pointer}
.mkrow .n{flex:none;width:26px;height:23px;background:var(--tag);color:var(--tagink);clip-path:polygon(12% 100%,50% 0,88% 100%);font:700 .78rem/1 var(--f-mono);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.mkrow.done .n{background:#9c968a}
.mkrow .t{flex:1;min-width:0}
.mkrow .s{font-size:.8rem;color:var(--mut);font-family:var(--f-mono)}
.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.thumbs button{background:none;border:0;padding:0;cursor:zoom-in;width:120px}
.thumbs img{width:120px;height:120px;object-fit:cover;display:block;border:1px solid var(--line)}
.thumbs span{display:block;font-size:.75rem;color:var(--mut);margin-top:4px;text-align:left;line-height:1.3}

/* piantina */
.rmap{position:relative;line-height:0}
.rmap img{width:100%;height:auto;display:block}
.hs{position:absolute;background:transparent;border:2px solid transparent;padding:0;cursor:pointer}
.hs:hover,.hs:active{border-color:var(--tag);background:rgba(243,194,52,.14)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rooms button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;min-height:48px;cursor:pointer}
.rooms .c{font-family:var(--f-mono);font-size:.78rem;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.rooms .c.all{color:var(--ok)}
.rooms .c.nw{color:var(--tag)}

/* fogli di carta */
.paper{background:var(--paper);color:var(--ink);padding:18px 18px 20px;box-shadow:0 8px 22px rgba(0,0,0,.5);font-family:var(--f-mono);font-size:.92rem;line-height:1.5;position:relative}
.paper h4{font-family:var(--f-disp);font-weight:400;font-size:1.05rem;margin:0 0 2px}
.paper .hd{font-size:.75rem;color:var(--inkmut);margin-bottom:12px;border-bottom:1px solid #c9bea6;padding-bottom:8px}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.paper dt{color:var(--inkmut)}
.paper dd{margin:0;min-width:0}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper td,.paper th{text-align:left;padding:3px 4px;border-bottom:1px dotted #b9ad94;font-weight:400;vertical-align:top}
.paper th{color:var(--inkmut);font-size:.78rem}
.paper .r{text-align:right}
.paper .ft{font-size:.72rem;color:var(--inkmut);margin-top:12px}
.paper .hw{font-family:var(--f-hand);font-size:1.35rem;line-height:1.2;color:#1d3a8a;margin-top:10px}
.paper s{color:var(--inkmut)}
.paper .ins{font-family:var(--f-hand);font-size:1.2rem;color:#1d3a8a}
.stampr{position:absolute;right:14px;top:14px;border:2px solid var(--red);color:var(--red);font-family:var(--f-disp);padding:2px 8px;transform:rotate(8deg);font-size:.85rem;background:rgba(239,230,210,.6)}
.note{background:#fbf8ef repeating-linear-gradient(#fbf8ef 0 29px,#b8cde6 29px 30px);color:#1d2f6b;font-family:var(--f-hand);font-size:1.38rem;line-height:30px;padding:14px 18px 18px 46px;box-shadow:0 8px 22px rgba(0,0,0,.5);position:relative;border-left:0}
.note::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#e3a3a3}
.note p+p{margin-top:0}
.note b{font-weight:700;color:var(--red)}
.rc{background:var(--paper2);color:var(--ink);font-family:var(--f-mono);font-size:.84rem;line-height:1.45;padding:16px 14px 22px;max-width:340px;margin:0 auto;box-shadow:0 8px 22px rgba(0,0,0,.5);position:relative;font-variant-numeric:tabular-nums}
.rc::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--paper2) 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,var(--paper2) 0) 0 0/12px 8px}
.rc .c{text-align:center}
.rc .row{display:grid;grid-template-columns:46px 34px 1fr auto;gap:6px}
.rc .row.gap{color:var(--red);grid-template-columns:1fr;text-align:center;border-block:1px dashed var(--red);padding-block:2px;margin-block:3px}
.rc hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rc .st{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--f-disp);padding:2px 8px;transform:rotate(-6deg);margin-top:8px}
.phone{background:#0d1018;border:8px solid #2a2d35;border-radius:30px;max-width:300px;margin:0 auto;padding:22px 12px 28px;color:#f2f2f2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.6);background-image:radial-gradient(circle at 30% 20%,#3a2a4a,transparent 60%),radial-gradient(circle at 80% 80%,#21344a,transparent 55%)}
.phone .tm{text-align:center;font-size:3.4rem;font-weight:300;line-height:1}
.phone .dt{text-align:center;font-size:.9rem;opacity:.8;margin:4px 0 18px}
.phone .nf{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;margin-top:8px;font-size:.84rem;line-height:1.35}
.phone .nf small{display:flex;justify-content:space-between;opacity:.7;font-size:.72rem;margin-bottom:2px}
.ph{margin:0}
.ph img{width:100%;height:auto;display:block;cursor:zoom-in}
.ph figcaption{font-family:var(--f-hand);font-size:1.25rem;color:#3a3125;line-height:1.1;padding-top:8px}
.ph.pol figcaption{position:absolute;left:12px;right:12px;bottom:6px;padding:0}
.ph.pol{position:relative}
.ph.framed figcaption{color:var(--mut);font-family:var(--f-body);font-size:.85rem;padding-top:6px}

/* foglio indizio */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,6,8,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto;border-top:3px solid var(--tag);padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet .hdr{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.sheet .x{background:none;border:1px solid var(--line);border-radius:3px;min-width:44px;min-height:44px;cursor:pointer;font-family:var(--f-disp)}
.sheet .tx{font-size:1.02rem}
.sheet .row2{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row2 .btn{flex:1;min-width:150px}
.star[aria-pressed="true"]{border-color:var(--tag);color:var(--tag)}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.95);overflow:auto}
.lb img{width:100%;display:block;cursor:zoom-in;max-width:none}
.lb.z img{width:240%;cursor:zoom-out}
#lbx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:41;background:var(--paper);color:var(--ink);border:0;border-radius:3px;padding:0 16px;min-height:44px;font-family:var(--f-disp);cursor:pointer}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(440px,calc(100% - 32px));text-align:center;z-index:45;background:var(--tag);color:var(--tagink);font-family:var(--f-disp);padding:10px 16px;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.6);max-width:calc(100% - 32px);font-size:.92rem}

/* sospettati */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.scard{background:none;border:0;padding:0;text-align:left;cursor:pointer}
.scard .pol{padding:7px 7px 10px}
.scard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;max-width:100%}
.scard .nm{font-family:var(--f-hand);font-size:1.4rem;color:#2b241b;line-height:1;padding-top:6px}
.scard .nk{font-size:.78rem;color:#6a604f;font-family:var(--f-body)}
.scard .bdg{display:inline-block;margin-top:4px;background:var(--tag);color:var(--tagink);font-family:var(--f-mono);font-size:.72rem;padding:1px 6px}
.vic .pol{position:relative}
.vic .pol::after{content:"";position:absolute;inset:7px 7px 46px;background:linear-gradient(to top right,transparent 47%,var(--red) 48%,var(--red) 52%,transparent 53%)}
.shead{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:start}
.shead img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.blk{border-left:3px solid var(--line);padding-left:12px}
.blk h3{font-size:.95rem;color:var(--mut);margin-bottom:4px}
.quote{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.quote .w{font-family:var(--f-mono);font-size:.75rem;color:var(--mut);margin-bottom:4px}
.locked{border-style:dashed;color:var(--mut);font-size:.9rem}

/* prove */
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:10px;min-height:44px;font-family:var(--f-disp);cursor:pointer;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--mut);min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--tag)}
.grp h3{font-size:1rem;color:var(--mut);margin:6px 0 8px}
.bags{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.bags button{background:none;border:0;padding:0;cursor:zoom-in;text-align:left}
.bags img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;max-width:100%;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.bags span{display:block;font-size:.85rem;margin-top:6px}

/* taccuino */
textarea{width:100%;min-height:200px;background:var(--paper2) repeating-linear-gradient(var(--paper2) 0 29px,#cfdcec 29px 30px);color:#1d2f6b;font:1.3rem/30px var(--f-hand);padding:4px 14px;border:0;border-radius:2px;resize:vertical}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.tl .h{font-family:var(--f-mono);color:var(--tag);font-variant-numeric:tabular-nums}

/* accusa */
.acc label{display:block;font-family:var(--f-disp);margin:0 0 6px}
.acc select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:12px;min-height:48px;font:inherit}
.err{color:#ff8f86}
.verdict{border:2px solid var(--red);padding:16px}
.verdict.win{border-color:var(--ok)}
.sol p+p{margin-top:10px}
.sol ul{margin:8px 0 0;padding-left:20px}

/* aggiunte: ricerca nella foto, indietro, cronologia, tabella dell'accusa */
.top{flex-wrap:nowrap}
.top .left{display:flex;gap:8px;align-items:center;min-width:0}
.top .case{white-space:nowrap}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:.92rem}
.status b{font-family:var(--f-mono);color:var(--tag);font-variant-numeric:tabular-nums}
.lens{background:none;border:1px solid var(--line);border-radius:3px;min-height:40px;padding:0 12px;font-family:var(--f-disp);cursor:pointer;white-space:nowrap}
.lens[aria-pressed="true"]{border-color:var(--tag);color:var(--tag)}
.zw{overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.zw.z .scene{width:230%}
.scene{cursor:crosshair}
.found{position:absolute;border:2px dashed rgba(243,194,52,.9);border-radius:6px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.found i{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--tag);color:var(--tagink);font:700 .7rem/20px var(--f-mono);text-align:center;font-style:normal}
.miss{position:absolute;transform:translate(-50%,-50%);pointer-events:none;width:46px;height:46px;border:2px solid var(--text);border-radius:50%;opacity:0}
@media (prefers-reduced-motion:no-preference){.miss{animation:miss .7s ease-out}@keyframes miss{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}}
@media (prefers-reduced-motion:reduce){.miss{opacity:.6}}
.sheet .hdr .back2{background:none;border:1px solid var(--line);border-radius:3px;min-height:44px;padding:0 14px;font-family:var(--f-disp);cursor:pointer;white-space:nowrap}
.tl li.new .h{color:var(--text)}
.tbl{display:grid;gap:12px}
.tr{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px}
.tr .q{font-family:var(--f-disp);margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.tr .q span{font-family:var(--f-mono);color:var(--tag);font-size:.85rem}
.tr select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:12px;min-height:48px;font:inherit;font-size:.95rem}
.tries{font-family:var(--f-mono);font-size:.85rem;color:var(--mut)}
.vic2{font-family:var(--f-mono);font-size:.85rem;color:var(--mut)}
.byline{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--f-disp);font-size:.8rem;color:var(--text);opacity:.8;background:rgba(11,12,15,.7);padding:4px 10px;border-radius:3px}
.reset{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;font-size:.85rem;min-height:44px;cursor:pointer;align-self:flex-start}
.rc .row{grid-template-columns:46px 1fr auto}
.tess{position:relative;container-type:inline-size;line-height:0;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.tess img{width:100%;display:block}
.nmw{position:absolute;left:30%;top:37.2%;transform:translateY(-50%);font-family:"Architects Daughter",var(--f-hand);color:#2b2b35;letter-spacing:.1em;white-space:nowrap;line-height:1;font-weight:400}
.tess .nmw{font-size:4.1cqw}
.pzg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#0b0c0f;padding:3px;border-radius:3px}

verbale:`<div class="paper"><h4>Verbale di intervento</h4><div class="hd">Polizia Scientifica · Squadra rilievi · documento di gioco</div><dl>
<dt>Luogo</dt><dd>Circolo Il Fortino, Marina di Pisa</dd>

<div class="ft">Fatti e persone di questo caso sono inventati.</div></div>`,
referto:`<div class="paper"><span class="stampr">Riservato</span><h4>Esame esterno preliminare</h4><div class="hd">Medico legale di turno · ore 01:40</div>
<p>Prima ferita, alla nuca: lacero-contusa, con microframmenti di vetro verde. Non mortale, compatibile con uno stordimento.</p>
<p style="margin-top:8px">Seconda ferita, alla tempia: colpo violento con un oggetto pesante e arrotondato, di qualche chilo. Bordi netti, nessun frammento. Questa è la causa della morte.</p>
<p style="margin-top:8px">Il corpo è stato chiuso nel congelatore dopo la morte: l'ora esatta non si può stabilire, tra le 22:15 e le 23:30. Il freddo ha alterato i tessuti intorno alle ferite.</p>
<p style="margin-top:8px">Sulla spalla sinistra: polvere azzurra di gesso da biliardo. Nel cappuccio: un frammento di tessera ARCI.</p>
<p style="margin-top:8px">Impronte sul coperchio: fresche quelle di Danila; altre parziali, non identificabili. Nelle tasche: chiavi, accendino. Nessun portafoglio.</p></div>`,

d_porta:{r:"disimpegno",t:"La porta a vetri",x:"Il vetro è trasparente: dalla sala carte si vede il corridoio, se qualcuno si gira a guardare. Ma durante il bridge nessuno si gira. E sopra la porta non c'è nessuna telecamera: questo pezzo non lo riprende nessuno."},

o_scaletta:{r:"oro",q:["f_referto"],t:"La scaletta rossa",p:[ph("w9")],x:"Sopra la scaletta rossa, due sacchi di ghiaccio mezzi sciolti. Uno è squarciato su un lato e l'acqua cola fino a terra, in una pozza accanto al congelatore. Il ghiaccio, di solito, sta nel pozzetto."},
o_porta:{r:"oro",t:"La porta d'oro",p:[ph("s_porta")],x:"Si chiude solo a chiave, ma stasera nessuno l'aveva chiusa: nessun segno di scasso. La lampadina del magazzino è fulminata: qui dentro, di sera, non si vede niente. A terra, davanti alla soglia, c'è un gratta e vinci grattato a metà."},
o_tel:{r:"oro",q:["o_tel"],t:"Il telefono sbloccato",p:[`<div id="pinbox"></div>`],x:"Il PIN è una data di compleanno: 18/03. Sul foglio dello spogliatoio corrisponde a una sola persona.",tl:[["20:58","Giulia scrive alla sorella: «Ho fatto una cosa»"],["22:13","Sul telefono di Giulia si accende la torcia"],["22:14–22:31","Sei tentativi di sblocco sbagliati sul telefono di Giulia"],["22:28","Il telefono di Giulia scatta una foto buia nel Magazzino Oro"]]},

ba_wc:{r:"bagni",t:"Il WC degli uomini",x:"Un disastro, segnato con quattro cartellini. Appoggiato al muro c'è il mocio che manca dal magazzino del bar: oltre al resto, ha birra e qualche macchia rossa. Chi aspettava fuori lo conferma: la porta è rimasta chiusa dalle 21:55 alle 22:25.",tl:[["21:55–22:25","Il bagno degli uomini resta chiuso"]]},
ba_lavandino:{r:"bagni",t:"Il cestino",x:"Sotto il lavandino, nel cestino, guanti di lattice e uno straccio da buttare. Sul bordo del lavandino c'è un anello di birra."},
ba_porta:{r:"bagni",t:"La porta in fondo",go:"spogl",x:"La porta dello spogliatoio dei dipendenti. È socchiusa."},

sp_armadietto:{r:"spogl",t:"Sulla panca",q:["o_tel","sp_turni"],p:[DOC.quaderno],x:"Sulla panca, accanto al cartellino 7, c'è un quaderno con la copertina di pelle. Dentro la copertina, a penna: Giulia."},
sp_turni:{r:"spogl",t:"Gli orari del bar",p:[DOC.turni],x:"Il foglio degli orari, fermato al muro con lo scotch."},

m_vuoti:{r:"magbar",q:["d_frammento"],t:"Le casse dei vuoti",p:[ph("w2")],x:"Due casse di Beck's vuote da rendere. In mezzo alle bottiglie verdi ce n'è una diversa: una Tennent's Super, ancora bagnata. Al collo manca un pezzo."},

x_sedie:{r:"grande",q:["s_stecca"],t:"Le sedie in fila",x:"Sulla prima sedia c'è una custodia da stecca, vuota. Dentro, un biglietto da visita: Biliardi Ceccarelli, Pisa."},

p_vaso:{r:"piazzetta",q:["danila:1"],t:"Il vaso",x:"Nella terra del vaso c'è un mazzo di chiavi con il portachiavi del circolo. Una ha il profilo dorato: apre il Magazzino Oro."}

const SUS=[
{k:"josef",n:"Josef",nk:"l'ubriacone",
 chi:"Socio con lo sgabello fisso al bancone, sempre sbronzo e fedele a una sola birra: la Tennent's Super. Quando beve troppo se la prende con qualcuno e il giorno dopo non ricorda niente. Il presidente gli aveva appeso in bacheca l'ultimo avviso: un'altra sbronza e fuori dal circolo. Stasera era così ubriaco che a tratti non stava in piedi, e Roberto giura di averlo dovuto sorreggere.",
 d:[{po:"sem",x:"Io? Sempre sul mio sgabello, con la mia Tennent's. Hic. Il presidente l'ho sentito al telefono, verso le dieci, nel corridoio dei magazzini. Diceva di togliere la Tennent's. A me! Poi sono tornato a sedere, eh.",tl:[["22:06","Josef sente Fabiano al telefono nel corridoio"]]},
    {po:"acc",q:["b_scontrino"],x:"L'Architetto che offre un giro? In vent'anni non l'ho mai visto pagare un caffè. Quei soldi non erano suoi, ve lo dico io. Uno così, per un euro, ammazza."},
    {po:"dif",q:["b_frigo"],x:"La Tennent's non la tolgono? E allora cosa ho sentito... Ero ubriaco, mica sordo. E comunque stasera in piedi non ci stavo nemmeno: chiedete a Roberto, mi ha tenuto su lui."},
    {po:"amm",q:["f_tele"],x:"Va bene, sono andato verso il bagno con la birra. Per terra c'era della birra, la mia credo. Sono scivolato... e la bottiglia ha preso qualcosa. O qualcuno. Mi sono spaventato, l'ho nascosta e sono tornato a sedere. Non volevo fare niente a nessuno, giuro.",tl:[["22:10","Josef scivola sulla birra nel disimpegno"]]}]},
{k:"danila",n:"Danila",nk:"la consigliera",
 chi:"Consigliera del direttivo. Vuole comandare tutti, risponde sempre male e non si fa mai gli affari suoi. Con Fabiano era tutta sorrisi, ma alle riunioni lui la umiliava davanti a tutti. Aspetta la presidenza da anni, ha le chiavi del Magazzino Oro ed è stata lei ad aprire il congelatore. Per caso, dice.",
 d:[{po:"dif",x:"Al bridge non mi sono mossa: chiedete a Guido, Giovanni e Franco, al tavolo 3 della sala carte. Il presidente l'ho trovato io, a mezzanotte e venti. Qualcuno doveva pur controllare il magazzino."},
    {po:"acc",q:["o_pozzetto"],x:"Se cercate un ladro, cercate Luca. Le chiavi del magazzino non le ha mai restituite, e stasera girava in piazzetta come un'anima in pena."},
    {po:"amm",q:["c_bridge"],x:"Facevo il morto, va bene: mi sono alzata a prendere un amaro. Due minuti, sette, che importa. Nel corridoio ho incrociato qualcuno che tornava dai magazzini, di fretta. Senza occhiali, al buio, non ho visto chi.",tl:[["22:46–22:53","Danila lontana dal bridge"]]},
    {po:"sem",q:["c_sacco"],x:"Il discorso? Una presidente seria si prepara. Morto un presidente se ne fa un altro: lo dicono tutti, io l'ho solo scritto. E sì, quei minuti lontano dal tavolo li ho passati in bagno, a provarlo davanti allo specchio. Il quadro l'ho tolto per appenderci il ritratto di Fabiano. Altro che odio."}]},
{k:"luca",n:"Luca",nk:"l'ex barista",
 chi:"Ex barista, licenziato da Fabiano per i soldi spariti dalla cassa. Gratta e vinci in tasca e una schedina sempre aperta; in giro dicono anche che si droghi, ma è una voce falsa. Stasera è tornato a chiedere il posto e si è sentito dire di no davanti a tutti. Le chiavi del circolo non le ha mai restituite.",
 d:[{po:"sem",x:"Ho chiesto a Fabiano di riprendermi al bar e mi ha detto di no, davanti a tutti. Va bene così. Poi sono rimasto coi miei amici a guardare la partita."},
    {po:"acc",q:["o_pozzetto"],x:"Volete sapere chi lo odiava davvero? Ceccarelli. Stasera girava con quella stecca rotta come fosse un manganello e diceva che prima o poi gliela dava in testa. Andate a vedere in saletta."},
    {po:"dif",q:["g_bidone"],x:"La Beck's rotta l'hanno rotta i miei amici all'intervallo, facendo i cretini. Io verso le dieci e un quarto sono uscito in piazzetta a fumare. Da solo, sì. Embè?"},
    {po:"amm",q:["p_vaso"],x:"Le chiavi sono mie, non le ho mai ridate: le ho buttate nel vaso quando ho visto la polizia. E il barattolo delle mance l'ho preso io, prima della partita, per la schedina. L'ho sbattuto sul bidone per far uscire le monete, da lì l'ammaccatura. Alle undici meno dieci sono rientrato dal retro per due birre dal magazzino del bar, e lì mi sarà caduto il gratta e vinci. Vecchie abitudini."}]},
{k:"arch",n:"L'Architetto",nk:"lo spilorcio",
 chi:"Socio di lunga data, ucciderebbe per un euro. Conosce a memoria il listino e non prende mai niente, perché costa tutto troppo: di solito paga il suo amico Roberto. Il presidente aveva appeso in bacheca un avviso contro chi occupa i tavoli senza consumare, e tutti hanno capito per chi era. Stasera, per la prima volta in vent'anni, ha offerto un giro a tutto il bancone.",
 d:[{po:"dif",x:"Ho guardato la partita con Roberto, come sempre. Non ho preso niente perché non c'era niente che valesse il prezzo. Mi sono alzato solo per sgranchirmi le gambe."},
    {po:"acc",q:["o_pozzetto"],x:"Guardate Luca. Alle undici meno dieci l'ho visto rientrare dal retro con il giubbotto vuoto e uscire con il giubbotto pieno. E le chiavi del magazzino, guarda caso, ce le ha ancora lui. E già che ci siete, passate dalla sala grande: oggi pomeriggio il presidente ci ha fatto una scenata col suo Guerriero Pisano."},
    {po:"sem",q:["b_scontrino"],x:"Ho offerto un giro. Una volta nella vita. Avevo vinto... una piccola cosa. Non sono affari vostri."},
    {po:"amm",q:["b_wallet"],x:"Il portafoglio l'ho trovato per terra nel corridoio, verso le dieci e un quarto. Non ho guardato di chi fosse, ho guardato quanto c'era. Dal magazzino veniva un lamento: ho pensato a Rolando, con quel che aveva mangiato.",tl:[["22:15","L'Architetto trova il portafoglio e sente un lamento dal magazzino"]]}]},
{k:"cec",n:"Ceccarelli",nk:"il nostalgico del biliardo",
 chi:"Orlando Ceccarelli, giocatore di biliardo. Da quando hanno rifatto il bar il biliardo non c'è più, e il presidente ha detto di no ogni volta che chiedeva di rimetterlo. Quando se ne ricorda giura vendetta, e se ne ricorda spesso. Oggi pomeriggio a Pisa ha spaccato la sua stecca, e stasera è arrivato al circolo già nero.",
 d:[{po:"sem",x:"Ero al bar con mia nipote Marta, un caffè e due chiacchiere. Del biliardo parlo con tutti, lo sanno anche i muri. Ma il presidente lo volevo vivo, a sentire le mie lamentele.",tl:[["21:30","Ceccarelli prende un caffè al bar con la nipote Marta"]]},
    {po:"acc",q:["o_pozzetto"],x:"Guardate Rolando, piuttosto: mezz'ora chiuso nel bagno accanto al corridoio dei magazzini, proprio quando il presidente è sparito. Mezz'ora! Chi ci crede?"},
    {po:"dif",q:["s_stecca"],x:"La stecca l'ho rotta oggi pomeriggio a Pisa, contro un tavolo. La macchia è gesso e chinotto. La custodia è vuota perché quella nuova non l'ho trovata. Contenti?"},
    {po:"amm",q:["s_tessera"],x:"La tessera l'ho strappata io, alle nove meno dieci, e i pezzi glieli ho tirati addosso. Il gesso sulla spalla? L'ho preso per la giacca, una volta sola. E verso le dieci e un quarto sono uscito a fumare in giardino: Marta guardava il telefono, non se n'è accorta.",tl:[["20:50","Ceccarelli strappa la tessera e la tira addosso a Fabiano"]]}]},
{k:"giulia",n:"Giulia",nk:"la barista",
 chi:"Barista del circolo, stasera da sola al banco con la partita e i rigori. Distratta come nessuno: perde il telefono dopo un secondo e lascia le cose dove capita. Gentile con tutti, anche con chi non se lo merita. Il presidente la trattava male davanti ai clienti, e lei sorrideva sempre. Chi lavora al banco ha anche le chiavi del Magazzino Oro.",
 d:[{po:"sem",x:"Ho servito al banco tutta la sera, da sola, con la partita e i rigori. Non mi sono fermata un minuto. Il telefono? L'ho perso verso le nove, come sempre."},
    {po:"acc",q:["o_pozzetto"],x:"Danila stasera era strana. Le chiavi del magazzino ce le ha anche lei, e l'ho vista girarsele tra le dita tutta la sera. E al presidente sorrideva troppo."},
    {po:"dif",q:["o_tel"],x:"Sì, è il mio telefono. L'avevo dimenticato in magazzino verso le nove, quando sono andata a prendere i limoni. E il messaggio a Francesca... ho firmato con un altro bar. Domani mi licenziavo. Volevo dirglielo in faccia, al presidente. E la porta del magazzino l'avrò lasciata aperta io, come sempre."},
    {po:"amm",q:["f_tele","k_lavello"],x:"Va bene: il ghiaccio non l'ho preso. Alle dieci il presidente mi ha umiliata davanti a tutti, per l'amaro. Mi sono chiusa nello spogliatoio a piangere per un quarto d'ora. E il portafiltro l'ho lavato io e me lo sono scordato in cucina. Io dimentico tutto, lo sapete."}]},
{k:"rolando",n:"Rolando",nk:"il cagone",
 chi:"Cliente fisso, dalla mattina alla sera davanti alla TV. Fabiano aveva annunciato la disdetta dell'abbonamento alle partite: dal 1° dicembre niente calcio al bar, e per Rolando è stato peggio di un lutto. Stasera ha passato mezz'ora chiuso nel bagno accanto al corridoio dei magazzini, proprio quando il presidente è sparito.",

    {po:"acc",q:["o_pozzetto"],x:"Quando sono uscito dal bagno, Luca rientrava dalla piazzetta tutto agitato, con le mani in tasca. Uno che ruba dalla cassa ruba anche altro."},
    {po:"dif",q:["d_cartello"],x:"Il cartello l'ho messo io e il mocio l'ho preso io. E va bene: una passata nel corridoio l'ho data, ci ero scivolato. Le macchie rosse? Al buio pensavo fosse sugo. L'impronta nella birra è la mia, il 45. Non l'ho detto perché sembrava brutto."},
    {po:"sem",q:["d_frammento"],x:"E va bene: verso le dieci e dieci ho sentito un vetro rompersi qui fuori e uno che scivolava bestemmiando. Poi passi lenti, strascicati, verso il fondo del corridoio. Non sono uscito, ero... impegnato.",tl:[["22:10","Rolando sente un vetro rompersi e qualcuno scivolare"]]}]}

const VOL=.16;let AC=null,GN=null,SRC=null,MUS_LOADING=false,TRACK="tema";const BUFS={};
async function loadTrack(n){if(BUFS[n])return BUFS[n];const buf=await AC.decodeAudioData(await (await fetch("audio/"+n+".mp3")).arrayBuffer());const d=buf.getChannelData(0),sr=buf.sampleRate;let a=0,b=d.length-1;while(a<sr&&Math.abs(d[a])<1e-4)a++;while(b>d.length-sr&&Math.abs(d[b])<1e-4)b--;BUFS[n]={buf,ls:a/sr,le:(b+1)/sr};return BUFS[n]}
async function musicStart(){
  if(S.music===false)return;
  try{
    acx();if(AC.state==="suspended")await AC.resume();
    if(SRC||MUS_LOADING){fadeTo(VOL,2);return}
    MUS_LOADING=true;const T=await loadTrack(TRACK);
    SRC=AC.createBufferSource();SRC.buffer=T.buf;SRC.loop=true;SRC.loopStart=T.ls;SRC.loopEnd=T.le;SRC.connect(GN);SRC.start(0,T.ls);
    MUS_LOADING=false;fadeTo(VOL,8);
  }catch(e){MUS_LOADING=false}
}
async function switchTrack(n){
  if(TRACK===n)return;TRACK=n;if(!AC||!SRC||S.music===false){SRC=null;return}
  try{const old=SRC,og=GN;const t=AC.currentTime;og.gain.cancelScheduledValues(t);og.gain.setValueAtTime(og.gain.value,t);og.gain.linearRampToValueAtTime(0,t+2.5);setTimeout(()=>{try{old.stop()}catch(e){}},2700);
    GN=AC.createGain();GN.gain.value=0;GN.connect(AC.destination);SRC=null;MUS_LOADING=false;await musicStart()}catch(e){}
}
function fadeTo(v,sec){if(!GN)return;const t=AC.currentTime;GN.gain.cancelScheduledValues(t);GN.gain.setValueAtTime(GN.gain.value,t);GN.gain.linearRampToValueAtTime(v,t+sec)}

/* ===================== PUZZLE DELLA TESSERA ===================== */
const TC=4,TR=2,TW=1000,TH=672,TCW=TW/TC,TRH=TH/TR,TM=34;
let TZG=null,TZSEL=null;
function tzRand(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647}}
function tzGeom(){
  if(TZG)return TZG;const rnd=tzRand(4242);const V={},H={};
  for(let c=1;c<TC;c++){const pts=[];for(let r=0;r<TR;r++){const n=4;for(let i=0;i<n;i++){const y=r*TRH+i*TRH/n;pts.push([c*TCW+(i===0?0:(rnd()-.5)*2*TM*.8),y])}}pts.push([c*TCW,TH]);V[c]=pts}
  for(let r=1;r<TR;r++){const pts=[];for(let c=0;c<TC;c++){const n=5;for(let i=0;i<n;i++){const x=c*TCW+i*TCW/n;pts.push([x,r*TRH+(i===0?0:(rnd()-.5)*2*TM*.8)])}}pts.push([TW,r*TRH]);H[r]=pts}
  const P=[];
  for(let r=0;r<TR;r++)for(let c=0;c<TC;c++){
    const x0=c*TCW,x1=x0+TCW,y0=r*TRH,y1=y0+TRH,poly=[];
    if(r===0)poly.push([x0,0],[x1,0]);else poly.push(...H[r].filter(p=>p[0]>=x0-.01&&p[0]<=x1+.01));
    if(c===TC-1)poly.push([TW,y0],[TW,y1]);else poly.push(...V[c+1].filter(p=>p[1]>=y0-.01&&p[1]<=y1+.01));
    if(r===TR-1)poly.push([x1,TH],[x0,TH]);else poly.push(...H[r+1].filter(p=>p[0]>=x0-.01&&p[0]<=x1+.01).reverse());
    if(c===0)poly.push([0,y1],[0,y0]);else poly.push(...V[c].filter(p=>p[1]>=y0-.01&&p[1]<=y1+.01).reverse());
    const bx=Math.max(0,x0-TM),by=Math.max(0,y0-TM),bw=Math.min(TW,x1+TM)-bx,bh=Math.min(TH,y1+TM)-by;
    P.push({c,r,bx,by,bw,bh,clip:"polygon("+poly.map(p=>((p[0]-bx)/bw*100).toFixed(2)+"% "+((p[1]-by)/bh*100).toFixed(2)+"%").join(",")+")"})}
  return TZG=P;
}
function tzInit(tw,th,sc){
  if(S.tz&&S.tz.o&&S.tz.o.length===TC*TR)return;const P=tzGeom();
  S.tz={o:P.map(p=>{const l=Math.random()*(tw-p.bw*sc),t=Math.random()*(th-p.bh*sc);return[(l-p.bx*sc)/tw,(t-p.by*sc)/tw]}),g:P.map((p,i)=>i)};save();
}
let TZS=1,TZW=0,TZZ=10;
function openPuzzle(){
  PZSEL=null;TZSEL=null;
  const sh=document.getElementById("sheet");
  sh.innerHTML=`<div class="in" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="hdr"><button class="back2" data-a="close">‹ Indietro</button><div class="small mut" style="font-family:var(--f-mono)">Saletta piccola</div></div>
  <h2 id="sht" style="font-size:1.4rem">Pezzi di carta</h2>
  <p class="tx">Sul tavolo blu, accanto al cartellino 3, qualcuno ha strappato con rabbia una tessera. Trascina i pezzi e avvicinali: quando due pezzi combaciano si attaccano. Puoi anche toccare un pezzo e poi quello che gli va accanto.</p>
  <div class="tz" id="tz"></div><p class="mut small" id="tzm" role="status"></p>
  <button class="btn ghost" data-a="close">Lascia perdere per ora</button></div>`;
  sh.hidden=false;sh.querySelector(".in").scrollTop=0;pushH();
  const tz=document.getElementById("tz");TZW=tz.clientWidth;TZS=TZW*.62/TW;const th=Math.max(TH*TZS*2.1,340);tz.style.height=th+"px";
  tzInit(TZW,th,TZS);
  const P=tzGeom(),fs=TW*TZS*.041;
  tz.innerHTML=P.map((p,i)=>`<div class="tp" data-i="${i}" style="width:${p.bw*TZS}px;height:${p.bh*TZS}px"><div class="tq" style="clip-path:${p.clip}"><div class="tc" style="left:${-p.bx*TZS}px;top:${-p.by*TZS}px;width:${TW*TZS}px;height:${TH*TZS}px"><img src="${IM("tessera_retro")}" alt=""><span class="nmw" style="font-size:${fs}px">ORLANDO CECCARELLI</span></div></div></div>`).join("");
  tzPlace();
  tz.querySelectorAll(".tp").forEach(el=>el.addEventListener("pointerdown",tzDown));
}
function tzPlace(anim){const P=tzGeom();document.querySelectorAll("#tz .tp").forEach(el=>{const i=+el.dataset.i,o=S.tz.o[i];el.classList.toggle("snap",!!anim);el.style.left=(o[0]*TZW+P[i].bx*TZS)+"px";el.style.top=(o[1]*TZW+P[i].by*TZS)+"px"})}
let TZD=null;
function tzDown(e){
  const el=e.currentTarget,i=+el.dataset.i,g=S.tz.g[i];e.preventDefault();el.setPointerCapture(e.pointerId);
  const mem=S.tz.g.map((x,k)=>x===g?k:-1).filter(k=>k>=0);TZZ++;
  document.querySelectorAll("#tz .tp").forEach(t=>{if(mem.includes(+t.dataset.i)){t.style.zIndex=TZZ;t.classList.add("drag");t.classList.remove("snap")}});
  TZD={i,mem,x:e.clientX,y:e.clientY,start:mem.map(k=>S.tz.o[k].slice()),moved:false};
  el.onpointermove=ev=>{if(!TZD)return;const dx=(ev.clientX-TZD.x)/TZW,dy=(ev.clientY-TZD.y)/TZW;if(Math.abs(ev.clientX-TZD.x)+Math.abs(ev.clientY-TZD.y)>6)TZD.moved=true;TZD.mem.forEach((k,j)=>{S.tz.o[k]=[TZD.start[j][0]+dx,TZD.start[j][1]+dy]});tzPlace()};
  el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;el.onpointerup=null;const d=TZD;TZD=null;document.querySelectorAll("#tz .tp.drag").forEach(t=>t.classList.remove("drag"));
    if(!d.moved){tzTapSel(d.i);return}TZSEL=null;tzMark();tzSnap(d.i,false)}
}
const tzAdj=(a,b)=>{const P=tzGeom();return Math.abs(P[a].c-P[b].c)+Math.abs(P[a].r-P[b].r)===1};
function tzMerge(ga,gb,target){const o=S.tz.o[target].slice();S.tz.g.forEach((x,k)=>{if(x===ga||x===gb){S.tz.g[k]=gb;S.tz.o[k]=o.slice()}})}
function tzSnap(i,force,j){
  const g=S.tz.g[i],mem=S.tz.g.map((x,k)=>x===g?k:-1).filter(k=>k>=0);let hit=null;
  for(const a of mem)for(let b=0;b<TC*TR;b++){if(S.tz.g[b]===g||!tzAdj(a,b))continue;if(j!=null&&S.tz.g[b]!==S.tz.g[j])continue;const d=Math.hypot(S.tz.o[a][0]-S.tz.o[b][0],S.tz.o[a][1]-S.tz.o[b][1]);if(force||d<.05){hit=b;break}}
  const m=document.getElementById("tzm");
  if(hit==null){if(force){sfx("tap");m.textContent="Questi due pezzi non combaciano."}save();return false}
  tzMerge(g,S.tz.g[hit],hit);sfx("busta");save();tzPlace(true);
  const left=new Set(S.tz.g).size;m.textContent=left===1?"":`Pezzi uniti. Gruppi rimasti: ${left}.`;
  if(left===1)tzDone();return true;
}
function tzTapSel(i){
  if(TZSEL===null||S.tz.g[TZSEL]===S.tz.g[i]){TZSEL=TZSEL===i?null:i;sfx("tap");tzMark();return}
  const a=TZSEL;TZSEL=null;tzMark();tzSnap(a,true,i);
}
function tzMark(){document.querySelectorAll("#tz .tp").forEach(t=>t.classList.toggle("sel",TZSEL!==null&&S.tz.g[+t.dataset.i]===S.tz.g[TZSEL]))}
function tzDone(){
  const tz=document.getElementById("tz"),th=tz.clientHeight,P=tzGeom();
  S.tz.o=S.tz.o.map(()=>[(TZW-TW*TZS)/2/TZW,(th-TH*TZS)/2/TZW]);save();setTimeout(()=>tzPlace(true),200);
  tz.classList.add("done");sfx("solved");document.getElementById("tzm").textContent="La tessera è ricomposta.";
  setTimeout(()=>{document.getElementById("sheet").hidden=true;sfx("busta");openClue("s_tessera")},1800);
}

    case"revgo":{const x=(document.getElementById("revc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(x==="CIF1951"){S.rev=true;save();document.getElementById("md").hidden=true;sfx("busta");render();toast("Gli indizi mancanti ora sono cerchiati di verde nelle foto.")}else{document.getElementById("reverr").textContent="Codice sbagliato.";sfx("tap")}break}
    case"fasc":openFasc();break;
    case"cover":typeStop();clearTimeout(FT);STACK.length=0;V.tab="cover";V.room=null;render();window.scrollTo(0,0);break;
    case"reset1":V.confirm=true;render();break;
    case"reset0":V.confirm=false;render();break;
    case"reset1go":V.tab="time";V.confirm=true;render();window.scrollTo(0,document.body.scrollHeight);break;
    case"reset2":S=FRESH();save();STACK.length=0;V={tab:"cover",room:null,sus:null,pt:"ind",only:false,zoom:false};render();break;
    case"zoom":{const lb=document.getElementById("lb");document.getElementById("lbi").src=IM(v);lb.classList.remove("z");lb.hidden=false;lb.scrollTop=0;pushH();break}
    case"lbzoom":document.getElementById("lb").classList.toggle("z");break;
    case"lbclose":document.getElementById("lb").hidden=true;break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")goBack()});

function start(d){if(d&&d.tab)Object.assign(V,d);render()}
window.claude?.hot?.snapshot?.(()=>snap());
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
